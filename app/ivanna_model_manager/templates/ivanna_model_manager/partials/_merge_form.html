{% load i18n %}
<form id="mergeForm">
    {% csrf_token %}
    
    <div class="mb-3">
        <label class="form-label">{% trans "Название слитой модели" %}</label>
        <input type="text" class="form-control" name="name" 
               placeholder="{% trans 'Моя слитая модель' %}" required>
    </div>
    
    <div class="row g-3">
        <div class="col-md-6">
            <label class="form-label">{% trans "Базовая модель" %}</label>
            <select class="form-select" name="base_model" required>
                <option value="">{% trans "-- Выберите модель --" %}</option>
                {% for model in loaded_models %}
                <option value="{{ model.id }}">
                    {{ model.name }} ({{ model.get_model_type_display }})
                </option>
                {% empty %}
                <option value="">{% trans "Нет загруженных моделей" %}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="col-md-6">
            <label class="form-label">{% trans "Модель для слияния" %}</label>
            <select class="form-select" name="merge_model" required>
                <option value="">{% trans "-- Выберите модель --" %}</option>
                {% for model in loaded_models %}
                <option value="{{ model.id }}">
                    {{ model.name }} ({{ model.get_model_type_display }})
                </option>
                {% empty %}
                <option value="">{% trans "Нет загруженных моделей" %}</option>
                {% endfor %}
            </select>
        </div>
    </div>
    
    <div class="row g-3 mt-2">
        <div class="col-md-6">
            <label class="form-label">{% trans "Метод слияния" %}</label>
            <select class="form-select" name="merge_method">
                <option value="TIES">{% trans "TIES (рекомендуется)" %}</option>
                <option value="SLERP">SLERP</option>
                <option value="DARE">DARE</option>
                <option value="LINEAR">Linear</option>
            </select>
        </div>
        
        <div class="col-md-6">
            <label class="form-label">{% trans "Коэффициент слияния" %}</label>
            <input type="number" class="form-control" name="merge_ratio" 
                   min="0" max="1" step="0.1" value="0.5">
            <div class="form-text">{% trans "0 = только базовая, 1 = только сливаемая" %}</div>
        </div>
    </div>
    
    <div class="mt-4">
        <button type="submit" class="btn btn-primary">
            <i class="bi bi-arrow-left-right"></i> {% trans "Начать слияние" %}
        </button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            {% trans "Отмена" %}
        </button>
    </div>
</form>

<script>
document.getElementById('mergeForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const formData = new FormData(this);
    const submitBtn = this.querySelector('button[type="submit"]');
    const originalText = submitBtn.innerHTML;
    
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i class="bi bi-hourglass-split"></i> Слияние...';
    
    try {
        const response = await fetch('{% url "start_merge" %}', {
            method: 'POST',
            body: formData
        });
        
        if (response.ok) {
            showToast('success', 'Успех', 'Слияние запущено');
            setTimeout(() => location.reload(), 2000);
        } else {
            const error = await response.json();
            showToast('error', 'Ошибка', error.error || 'Неизвестная ошибка');
        }
    } catch (error) {
        console.error('Ошибка слияния:', error);
        showToast('error', 'Ошибка', 'Не удалось запустить слияние');
    } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalText;
    }
});
</script>
