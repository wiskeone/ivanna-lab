{% load i18n %}
<div class="card">
    <div class="card-header">
        <h5 class="card-title mb-0">
            <i class="bi bi-chat-left-text"></i> {% trans "Инференс" %}
        </h5>
    </div>
    <div class="card-body">
        <form id="inferenceForm">
            {% csrf_token %}
            
            <div class="mb-3">
                <label for="prompt" class="form-label">{% trans "Запрос" %}</label>
                <textarea class="form-control" id="prompt" name="prompt" rows="4" 
                          placeholder="{% trans 'Введите ваш запрос здесь...' %}"></textarea>
            </div>
            
            <div class="row g-3">
                <div class="col-md-3">
                    <label for="max_length" class="form-label">{% trans "Макс. длина" %}</label>
                    <input type="number" class="form-control" id="max_length" name="max_length" 
                           min="10" max="4096" value="512">
                </div>
                <div class="col-md-3">
                    <label for="temperature" class="form-label">{% trans "Температура" %}</label>
                    <input type="number" class="form-control" id="temperature" name="temperature" 
                           min="0" max="2" step="0.1" value="0.7">
                </div>
                <div class="col-md-3">
                    <label for="top_p" class="form-label">Top-p</label>
                    <input type="number" class="form-control" id="top_p" name="top_p" 
                           min="0" max="1" step="0.1" value="0.9">
                </div>
                <div class="col-md-3">
                    <label for="top_k" class="form-label">Top-k</label>
                    <input type="number" class="form-control" id="top_k" name="top_k" 
                           min="0" max="100" value="50">
                </div>
            </div>
            
            <div class="form-check mt-3">
                <input class="form-check-input" type="checkbox" id="use_cache" name="use_cache" checked>
                <label class="form-check-label" for="use_cache">
                    {% trans "Использовать кэш внимания" %}
                </label>
            </div>
            
            <div class="mt-4">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-play-circle"></i> {% trans "Запустить инференс" %}
                </button>
                <button type="button" class="btn btn-outline-secondary" onclick="clearInferenceForm()">
                    <i class="bi bi-x-circle"></i> {% trans "Очистить" %}
                </button>
            </div>
        </form>
    </div>
</div>
