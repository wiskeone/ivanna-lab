{% extends 'ivanna_model_manager/base.html' %}
{% block title %}Удаление модели эмбеддингов{% endblock %}
{% block content %}
<div class="container">
    <div class="alert alert-danger">
        <h3>Подтверждение удаления</h3>
        <p>Вы уверены, что хотите удалить модель "{{ model.name }}"?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Удалить</button>
            <a href="{% url 'embedding_model_detail' model.pk %}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
