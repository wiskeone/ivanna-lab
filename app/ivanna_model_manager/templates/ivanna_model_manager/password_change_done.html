{% extends 'ivanna_model_manager/base.html' %}

{% block title %}Пароль изменен - Ivanna Lab{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0 text-center"><i class="fas fa-check-circle"></i> Пароль успешно изменен</h4>
                </div>
                <div class="card-body text-center">
                    <div class="mb-4">
                        <i class="fas fa-check-circle fa-4x text-success mb-3"></i>
                        <p class="lead">Ваш пароль был успешно изменен.</p>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <a href="{% url 'dashboard' %}" class="btn btn-primary btn-lg">
                            <i class="fas fa-home"></i> На главную
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
