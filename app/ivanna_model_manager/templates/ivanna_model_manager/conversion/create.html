{% extends 'ivanna_model_manager/base.html' %}
{% load static %}

{% block title %}Новая конвертация в GGUF{% endblock %}
{% block page_title %}Конвертация модели в GGUF{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-header">
                    <h5>Создание задачи конвертации</h5>
                </div>
                <div class="card-body">
                    <form method="post" id="conversionForm">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <div class="mt-3">
                            <button type="submit" class="btn btn-primary">Создать</button>
                            <a href="{% url 'conversion_dashboard' %}" class="btn btn-secondary">Отмена</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
